paths:
  /api/sessions/register:
    post:
      summary: Registrar un nuevo usuario
      tags:
        - Sessions
      description: Crea un nuevo usuario en el sistema con email y contraseña
      requestBody:
      required: true
      content:
        application/json:
          schema:
          type: object
          required:
            - first_name
            - last_name
            - email
            - password
          properties:
            first_name:
              type: string
              description: Nombre del usuario
              example: Pilar
            last_name:
              type: string
              description: Apellido del usuario
              example: Díaz Puga
            email:
              type: string
              format: email
              description: Email unico del usuario
              example: MariaEugenia.BarrazaGuillen@gmail.com
            password:
              type: string
              format: password
              description: Contraseña del usuario
              example: contraseña123
      responses:
        200:
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: string
                    description: Id del usuario creado
                    example: 69909ff3ef8cb993e1692ce8

  /api/sessions/current:
    get:
      summary: Obtener usuario actual
      tags:
        - Sessions
      description: Retorna la información del usuario autenticado mediante cookie JWT
      security:
        - cookieAuth: []
      responses:
        200:
          description: Usuario autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: object
                    properties:
                      name:
                        type: string
                        example: Pilar Díaz Puga
                      role:
                        type: string
                        example: user
                      email:
                        type: string
                        example: MariaEugenia.BarrazaGuillen@gmail.com

components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          description: ID único del usuario
          example: 69909ff3ef8cb993e1692ce8
        first_name:
          type: string
          description: Nombre del usuario
          example: Pilar
        last_name:
          type: string
          description: Apellido del usuario
          example: Díaz Puga
        email:
          type: string
          format: email
          description: Email del usuario
          example: MariaEugenia.BarrazaGuillen@gmail.com
        password:
          type: string
          description: Contraseña encriptada
          example: $2b$10$uYR2HCKlGLrgA9ow8VDZ/ehqYr2vbtQ.BB15xI3tMqsi/Fm9997Pq
        role:
          type: string
          enum: [user, admin]
          description: Rol del usuario
          example: user
        pets:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                example: 69909ff3ef8cb993e1692ce8
          description: Array de IDs de mascotas adoptadas
