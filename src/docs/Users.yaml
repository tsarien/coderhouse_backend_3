paths:
  /api/users:
    get:
      summary: Obtener todos los usuarios
      tags:
        - Users
      description: Retorna la lista completa de usuarios registrados en el sistema
      responses:
        200:
          description: Lista de usuarios obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        500:
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/users/{uid}:
    get:
      summary: Obtener un usuario por ID
      tags:
        - Users
      description: Retorna la información de un usuario específico
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: ID del usuario
          example: 69909ff3ef8cb993e1692ce8
      responses:
        200:
          description: Usuario encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: "#/components/schemas/User"
        404:
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: error
                error:
                  message: User not found

    put:
      summary: Actualizar un usuario
      tags:
        - Users
      description: Actualiza la información de un usuario existente
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: ID del usuario
          example: 69909ff3ef8cb993e1692ce8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: Pilar
                last_name:
                  type: string
                  example: Díaz Puga
                email:
                  type: string
                  format: email
                  example: MariaEugenia.BarrazaGuillen@gmail.com
                role:
                  type: string
                  enum: [user, admin]
                  example: user
      responses:
        200:
          description: Usuario actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User updated
        404:
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Eliminar un usuario
      tags:
        - Users
      description: Elimina un usuario del sistema
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: ID del usuario
          example: 69909ff3ef8cb993e1692ce8
      responses:
        200:
          description: Usuario eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User deleted
        404:
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          description: ID único del usuario
          example: 69909ff3ef8cb993e1692ce8
        first_name:
          type: string
          description: Nombre del usuario
          example: Pilar
        last_name:
          type: string
          description: Apellido del usuario
          example: Díaz Puga
        email:
          type: string
          format: email
          description: Email del usuario
          example: MariaEugenia.BarrazaGuillen@gmail.com
        password:
          type: string
          description: Contraseña encriptada
          example: "$2b$10$uYR2HCKlGLrgA9ow8VDZ/ehqYr2vbtQ.BB15xI3tMqsi/Fm9997Pq"
        role:
          type: string
          enum: [user, admin]
          description: Rol del usuario
          example: user
        pets:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                example: 69909ff5ef8cb993e1692cfc
          description: Array de IDs de mascotas adoptadas

    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: object
          properties:
            message:
              type: string
              example: User not found
            details:
              type: object
              description: Información adicional sobre el error
